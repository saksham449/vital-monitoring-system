spring.application.name=vital-monitoring
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vital_monitoring}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.port=${MQTT_PORT:1883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic=hospital/bed/+/vitals

frontend.url=${FRONTEND_URL:http://localhost:5173}
logging.level.com.saksham.vitalmonitoring=INFO
